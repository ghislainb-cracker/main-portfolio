<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Monoton&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
  <title>Ghislain Byimbo</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light") {
          document.documentElement.classList.remove("dark");
        } else {
          document.documentElement.classList.add("dark");
        }
      } catch (error) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #030712;
      color: #fff;
      font-family: Montserrat, sans-serif;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    html:not(.dark) #app-loader {
      background: #f8fafc;
      color: #0f172a;
    }

    #app-loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    html:not(.app-loaded) {
      overflow: hidden;
    }

    .loader-mark {
      width: 84px;
      height: 84px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      background: #4d77ff;
      color: #80db66;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.5px;
      animation: loader-pulse 1.4s ease-in-out infinite;
    }

    .loader-bar {
      width: 148px;
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(128, 219, 102, 0.18);
    }

    .loader-bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: #80db66;
      animation: loader-slide 1.1s ease-in-out infinite;
    }

    .loader-text {
      margin: 0;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    @keyframes loader-pulse {
      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(77, 119, 255, 0.35);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 0 14px rgba(77, 119, 255, 0);
      }
    }

    @keyframes loader-slide {
      0% {
        transform: translateX(-120%);
      }
      100% {
        transform: translateX(340%);
      }
    }
  </style>
</head>

<body>
  <div id="app-loader" aria-busy="true" aria-live="polite">
    <div class="loader-mark">GB</div>
    <div class="loader-bar"><span></span></div>
    <p class="loader-text">Loading</p>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
